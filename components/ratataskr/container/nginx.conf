worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    server {
        listen 8089;
        root /opt/ratataskr-snappymail;
        index index.php;
        location ~ /\. { deny all; }
        location ~* ^/(data|include\.php)(/|$) { return 404; }
        location / { try_files $uri $uri/ =404; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/ratataskr-snappymail/user-entry.php;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
            fastcgi_pass mail-php:9000;
            fastcgi_read_timeout 120s;
        }
        location ~ \.php(?:/|$) { return 404; }
    }
    server {
        listen 8088;
        root /opt/ratataskr-snappymail;
        index index.php;
        location ~ /\. { deny all; }
        location ~* ^/(data|include\.php)(/|$) { return 404; }
        location / { try_files $uri $uri/ =404; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/ratataskr-snappymail/index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
            fastcgi_pass mail-php:9000;
            fastcgi_read_timeout 120s;
        }
        location ~ \.php(?:/|$) { return 404; }
    }
}
