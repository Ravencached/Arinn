[global]
daemonize = no
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
[mail]
user = www-data
group = www-data
listen = 9000
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 300
request_terminate_timeout = 120s
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[zend.exception_ignore_args] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_value[session.save_path] = /var/lib/ratataskr-snappymail/php-sessions
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[curl.cainfo] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Lax
