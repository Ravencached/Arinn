# Cloudflare Tunnel origin; loopback only, separate from Tailscale administration.
server {
    listen 127.0.0.1:8089;
    server_name mail.example.test;
    root /opt/ratataskr-snappymail;
    index index.php;
    server_tokens off;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ /\. { deny all; }
    location ~* ^/(data|include\.php)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
    location = /app { absolute_redirect off; return 302 /$is_args$args; }
    location = /app/ { absolute_redirect off; return 302 /$is_args$args; }

    # Invitation enrollment is reachable only through the Access-validated tunnel.
    location = /account-setup.php {
        client_max_body_size 8k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ratataskr-snappymail/account-setup.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass unix:/run/php/ratataskr-snappymail.sock;
        fastcgi_read_timeout 120s;
    }

    # Only the public entry point may execute PHP.
    location = /index.php {
        # Administration stays on the separate Tailscale origin (8088).
        if ($args ~* "(^|&)admin(?:[/=&]|$)") { return 403; }
        if ($arg_q ~* "(^|/)Admin") { return 403; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ratataskr-snappymail/user-entry.php;
        # This origin is reachable only via local access / trusted HTTPS proxy.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass unix:/run/php/ratataskr-snappymail.sock;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php(?:/|$) { return 404; }
}
