# Private origin only. Tailscale Serve will provide external HTTPS.
server {
    listen 127.0.0.1:8088;
    server_name _;
    root /opt/ratataskr-snappymail;
    index index.php;
    server_tokens off;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ /\. { deny all; }
    location ~* ^/(data|include\.php)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }

    # Only the public entry point may execute PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ratataskr-snappymail/index.php;
        # This origin is reachable only via local access / trusted HTTPS proxy.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass unix:/run/php/ratataskr-snappymail.sock;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php(?:/|$) { return 404; }
}
