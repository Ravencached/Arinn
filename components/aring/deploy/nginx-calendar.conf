# Standalone loopback origin; do not replace the existing mail configuration.
# Publish through a verified Cloudflare Tunnel hostname or a trusted HTTPS proxy.
server {
    listen 127.0.0.1:8091;
    server_name calendar.example.test;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:4387;
        proxy_set_header Host calendar.example.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
