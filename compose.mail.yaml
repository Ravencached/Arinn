# Used by the role generator. No host services or provider accounts are changed.
services:
  mail-php:
    build:
      context: .
      dockerfile: components/ratataskr/Dockerfile
    image: selfhost-suite-mail:local
    user: '33:33'
    volumes:
      - mail-state:/var/lib/ratataskr-snappymail
    networks: [mail]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  mail-web:
    build:
      context: .
      dockerfile: components/ratataskr/Dockerfile
    image: selfhost-suite-mail:local
    command: [nginx, -c, /etc/suite-mail/nginx.conf, -g, 'daemon off;']
    user: '33:33'
    depends_on:
      mail-php: {condition: service_healthy}
    networks: [mail]
    ports: ['127.0.0.1:${SUITE_MAIL_PORT:-8089}:8089', '127.0.0.1:${SUITE_MAIL_ADMIN_PORT:-8088}:8088']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1:8089/']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  mail-state:
networks:
  mail:
